name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Setup Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            echo "Found preinstalled NDK at: $NDK_PATH"
            echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload build error report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/

      - name: Get Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep -o '"versionName": "[^"]*"' update.json | cut -d'"' -f4)
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          files: app/build/outputs/apk/release/app-release.apk
          body: "Auto-generated release via GitHub Actions."
          draft: false
          prerelease: false
